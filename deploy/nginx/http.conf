# BrainDock -- plain HTTP.
#
# A template: deploy/nginx.sh fills in the @NAMES@ from backend/.env and
# installs the result. Edit this file, not the installed copy.
#
# Everything in this file sits inside a server block. The site shares Nginx
# with the other sites on the host, and a directive at the top level would
# change them too.

server {
    listen 80;
    listen [::]:80;
    server_name @SERVER_NAME@;

    # How Let's Encrypt checks that this server owns the name. It is the one
    # thing that must stay reachable without TLS -- for the first certificate
    # and for every renewal after it.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
