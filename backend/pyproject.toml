[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [".venv", "migrations", "staticfiles", "media"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "DJ",   # flake8-django
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
    "RUF",  # ruff-specific rules
]
ignore = [
    # Persian strings legitimately contain characters ruff flags as ambiguous
    # unicode; the UI language makes this unavoidable.
    "RUF001",
    "RUF002",
    "RUF003",
    # Mutable class attributes are the declarative idiom of both Django and
    # DRF: Meta.fields, Meta.constraints, Meta.indexes and every serializer
    # field are class-level lists by design. Annotating each one as ClassVar
    # would add noise without catching a real defect.
    "RUF012",
]

[tool.ruff.lint.isort]
known-first-party = ["config", "core", "apps"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
python_files = ["test_*.py", "*_test.py"]
testpaths = ["tests", "apps", "core"]
addopts = "-ra --strict-markers"
